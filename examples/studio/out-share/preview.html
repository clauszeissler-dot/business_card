<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Card – Lea Sommer</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">
<style>
:root{--bg:#F3F4F6;--fg:#111827;--muted:#4B5563;--card-shadow:0 18px 40px rgba(0,0,0,.18)}
@media (prefers-color-scheme: dark){:root{--bg:#0B0F19;--fg:#F3F4F6;--muted:#9CA3AF;--card-shadow:0 18px 40px rgba(0,0,0,.6)}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:24px 16px}
main{max-width:1100px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 4px} p{color:var(--muted);margin:0 0 24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:28px}
figure{margin:0} figure img{width:100%;height:auto;border-radius:10px;box-shadow:var(--card-shadow);display:block}
figcaption{margin-top:10px;color:var(--muted);font-size:.9rem}
ul{color:var(--muted);padding-left:20px}
</style></head><body><main>
<h1>Business Card – Lea Sommer</h1>
<p>Teilen-Bild 1200 × 627 px (LinkedIn-Link-Format) · Layout diagonal · pattern waves · theme dark. The preview includes the bleed area.</p>
<div class="cards">
<figure><img src="front.svg" alt="Front of the business card"><figcaption>Front</figcaption></figure>
<figure><img src="back.svg" alt="Back of the business card with QR code to the LinkedIn profile"><figcaption>Back – QR code links to https://www.linkedin.com/in/lea-sommer-beispiel/</figcaption></figure>
</div>
<h2 style="font-size:1rem;margin-top:28px">Notes</h2><ul><li>No notes.</li></ul>
</main></body></html>
