[project]
name = "linkedin-business-card"
version = "1.0.0"
description = "Agent-Skill: Business Card im eigenen CI plus Einstellungsanleitung für die native LinkedIn Business Card"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["segno==1.6.6"]

[dependency-groups]
dev = ["pytest==8.3.4", "opencv-python-headless==4.10.0.84", "pillow==11.0.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
